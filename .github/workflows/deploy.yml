name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean droplet
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Write deploy script
        run: |
          cat > /tmp/remote_deploy.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "${DEPLOY_PATH:-/opt/fai-app}"

          echo "==> Pulling latest"
          git fetch --all
          git reset --hard origin/main
          echo "==> Now on $(git rev-parse --short HEAD)"

          COMPOSE="docker compose -f docker-compose.prod.yml"

          echo "==> Backend: composer install"
          $COMPOSE exec -T backend composer install --no-dev --optimize-autoloader --no-interaction </dev/null

          echo "==> Backend: migrate central"
          $COMPOSE exec -T backend php artisan migrate --force </dev/null

          echo "==> Backend: migrate tenants"
          $COMPOSE exec -T backend php artisan tenants:migrate --force </dev/null

          echo "==> Backend: seed tenant roles"
          $COMPOSE exec -T backend php artisan tenants:seed --class=TenantRoleSeeder --force </dev/null

          echo "==> Backend: cache"
          $COMPOSE exec -T backend php artisan optimize:clear </dev/null
          $COMPOSE exec -T backend php artisan route:cache </dev/null
          $COMPOSE exec -T backend php artisan config:cache </dev/null

          echo "==> Frontend: install deps"
          $COMPOSE exec -T frontend npm ci --include=dev </dev/null

          echo "==> Frontend: build"
          $COMPOSE exec -T frontend npm run build </dev/null

          echo "==> Restart services"
          $COMPOSE restart frontend backend queue

          echo "==> Wait for containers to settle"
          sleep 8

          echo "==> Verify containers"
          $COMPOSE ps

          echo "==> Smoke test backend"
          BACKEND_HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://admicomhub.com/api/v1/ping || echo "000")
          echo "backend ping: $BACKEND_HTTP"
          if [ "$BACKEND_HTTP" != "200" ]; then
            echo "Backend smoke test FAILED (got $BACKEND_HTTP)"
            exit 1
          fi

          echo "==> Deploy complete"
          SCRIPT

      - name: Copy + execute script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          scp -i ~/.ssh/deploy_key /tmp/remote_deploy.sh $DEPLOY_USER@$DEPLOY_HOST:/tmp/remote_deploy.sh
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST "DEPLOY_PATH='$DEPLOY_PATH' bash /tmp/remote_deploy.sh"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/remote_deploy.sh
